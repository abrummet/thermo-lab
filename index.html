<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Energy Calorimetry Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-bench scene as the hero (16:10) with a procedure + TA-notes rail on the right; notebook panel below; stacks on narrow screens */
:root{
  --bg:#e7e9e4; --surface:#f7f8f5; --surface-2:#eef0eb; --ink:#1b2124; --muted:#5b6569; --line:#cdd2cb;
  --accent:#e0aa10; --accent-ink:#6e5300; --warn:#b8620f; --warn-bg:#fbefdf; --danger:#b3302a; --danger-bg:#f9e3e1;
  --ok:#2b7a4d; --ok-bg:#e2f1e7; --info:#2f6688; --info-bg:#e3eef5; --scene:#16191c;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111416; --surface:#1a1f22; --surface-2:#20262a; --ink:#e6eae5; --muted:#9aa4a7; --line:#2d3439;
  --accent:#f2c230; --accent-ink:#f2c230; --warn:#f0a04b; --warn-bg:#2f2416; --danger:#ef6b5e; --danger-bg:#331b19;
  --ok:#5cc489; --ok-bg:#16291f; --info:#7fb6d6; --info-bg:#172730; --scene:#0d0f11; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111416; --surface:#1a1f22; --surface-2:#20262a; --ink:#e6eae5; --muted:#9aa4a7; --line:#2d3439;
  --accent:#f2c230; --accent-ink:#f2c230; --warn:#f0a04b; --warn-bg:#2f2416; --danger:#ef6b5e; --danger-bg:#331b19;
  --ok:#5cc489; --ok-bg:#16291f; --info:#7fb6d6; --info-bg:#172730; --scene:#0d0f11; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
#app{padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font-family:inherit}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-left:auto}
.grp{display:flex;align-items:center;gap:7px}
.lbl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px var(--f-body);padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.dot.run{background:var(--muted)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.warn{background:var(--warn);border-color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--f-body);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:focus-visible,.seg button:focus-visible,.tabs button:focus-visible,.fld:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1050px){.main{grid-template-columns:minmax(0,1fr)}}
.left{min-width:0}
.stagewrap{position:relative}
.stage{background:var(--scene);border-radius:12px;overflow:hidden;aspect-ratio:16/10;max-width:100%;box-shadow:0 1px 0 rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.12)}
.stage svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;font-family:var(--f-body)}
.stage svg .lp rect[onpointerdown],.stage svg .lp{touch-action:none}
.stage .hit{cursor:pointer;outline:none}
.stage .hit:focus-visible{outline:2px solid #f2c230;outline-offset:3px}
.stage .mv{transition:transform .65s cubic-bezier(.45,.05,.25,1)}
.stage .lcd,.stage .mono{font-family:var(--f-mono)}
.stage .tag{font:500 13px var(--f-body);fill:#9aa5ab;letter-spacing:.03em}
.stage .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .2s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.9,1.1) skewX(4deg)}}
.stage .stirring{transform-box:fill-box;transform-origin:50% 0;animation:stir .42s ease-in-out infinite alternate}
@keyframes stir{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}
.stage .ripple{transform-box:fill-box;transform-origin:50% 50%;animation:rip .42s ease-in-out infinite alternate}
@keyframes rip{from{transform:scale(1,.6)}to{transform:scale(.97,1.9)}}
@media (prefers-reduced-motion:reduce){.stage .flame,.stage .stirring,.stage .ripple{animation:none}.stage .mv{transition:none}}

.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;pointer-events:none}
.topbar>*{pointer-events:auto}
.zoombar{display:flex;flex-wrap:wrap;gap:6px}
.zoombar button,.quick .q{border:1px solid rgba(255,255,255,.2);background:rgba(18,21,24,.8);color:#eef0ea;font:600 12px var(--f-body);padding:6px 10px;border-radius:7px;cursor:pointer;backdrop-filter:blur(6px)}
.zoombar button[aria-pressed="true"],.quick .q[aria-pressed="true"]{background:#f2c230;color:#1b1b16;border-color:#f2c230}
.zoombar button:focus-visible,.quick .q:focus-visible,.mbtn:focus-visible{outline:2px solid #f2c230;outline-offset:2px}
.quick{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-left:auto}
.quick .q{font-size:12.5px}
.quick .q.go{background:#2f9a4a;border-color:#2f9a4a;color:#fff}
.quick .q.stop{background:#c8362c;border-color:#c8362c;color:#fff}
.quick .q.pull{background:#f2c230;border-color:#f2c230;color:#1b1b16;animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(242,194,48,.6)}to{box-shadow:0 0 0 7px rgba(242,194,48,0)}}

.pop{position:absolute;z-index:5;transform:translate(-50%,calc(-100% - 10px));background:rgba(250,248,240,.98);color:#1b2124;border-radius:10px;padding:10px;width:200px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:pin .16s ease-out}
.pop.below{transform:translate(-50%,10px)}
@keyframes pin{from{opacity:0}to{opacity:1}}
.pop h4{margin:0;font:700 13.5px var(--f-body)}
.pop p,.pop label{margin:0;font-size:12.5px;color:#4a5458}
.pop input[type=range]{width:100%;accent-color:#2f6688}
.mbtn{border:1px solid #c9cdc4;background:#fff;color:#1b2124;font:600 12.5px var(--f-body);padding:7px 9px;border-radius:7px;cursor:pointer;text-align:left}
.mbtn:hover{border-color:#5b6569}
.mbtn.hot{background:#b8620f;border-color:#b8620f;color:#fff}

.toasts{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100% - 20px));pointer-events:none;z-index:4}
.toast{position:relative;pointer-events:auto;background:rgba(250,248,240,.97);color:#1b2124;border-radius:9px;padding:10px 30px 10px 14px;border-left:5px solid #b8620f;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px;animation:tin .25s ease-out}
.toast.info{border-left-color:#3d6f8f}.toast.danger{border-left-color:#b3302a}
.toast h4{margin:0 0 2px;font:700 14px var(--f-body)}
.toast p{margin:0}
.toast .x{position:absolute;top:4px;right:6px;border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:#5b6569;padding:4px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

.status{display:flex;gap:6px 16px;align-items:baseline;flex-wrap:wrap;padding:9px 2px 0;color:var(--muted);font-size:13px}
.status b{color:var(--ink);font-weight:600}
.status .clock{margin-left:auto;font-family:var(--f-mono);font-size:12.5px}

.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.1}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:5px 4px;border-radius:8px;font-size:13px}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-mono);border:1.5px solid var(--line);color:var(--muted)}
.step.done .n{border-color:var(--muted);color:var(--ink);font-size:16px}
.step.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.warn .n{background:var(--warn);border-color:var(--warn);color:#fff}
.step.ok,.step.done{color:var(--muted)}
.hint,.empty{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.empty{margin:0}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes:not(:empty){margin-top:2px}
.notes li{border-radius:8px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.notes li.warn{background:var(--warn-bg)}.notes li.warn b{color:var(--warn)}
.notes li.bad{background:var(--danger-bg)}.notes li.bad b{color:var(--danger)}
.notes li.ok{background:var(--ok-bg)}.notes li.ok b{color:var(--ok)}

.panel{padding:0;overflow:hidden}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:8px 10px 0;background:var(--surface-2);flex-wrap:wrap}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);font:600 15px var(--f-display);letter-spacing:.02em;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:17px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);margin-bottom:-1px}
.pane{padding:14px;display:flex;flex-direction:column;gap:16px}
.lead{margin:0;color:var(--muted);font-size:13px;max-width:75ch}
.pane h3{font:600 17px var(--f-display);margin:0 0 6px;letter-spacing:.01em}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;text-align:left;white-space:nowrap}
thead th{font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
tbody th{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
tr.cur th{color:var(--ink)}
tr.cur th::before{content:"▸ ";color:var(--accent-ink)}
tr.mrow td{padding:0 6px;white-space:normal}
.fld{width:96px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.fld.wide{width:120px}
.fld.ok{border-color:var(--ok);background:var(--ok-bg)}
.fld.bad{border-color:var(--danger);background:var(--danger-bg)}
.fld.info{border-color:var(--info)}
.msgs{list-style:none;margin:4px 0 8px;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-width:90ch}
.msgs li{padding:6px 9px;border-radius:7px;background:var(--danger-bg)}
.msgs li.info{background:var(--info-bg)}
.msgs li.rev{background:var(--warn-bg)}
.calc{border-top:1px solid var(--line);padding-top:12px}
.calc p{margin:0 0 8px;color:var(--muted);font-size:13px;max-width:75ch}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chead h3{margin:0 0 4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;min-width:0}
.unit{display:flex;align-items:center;gap:6px}
.unit em{font-style:normal;color:var(--muted);font-size:12px;min-width:42px}
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;align-items:start}
.ref ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.eq{font-family:var(--f-mono);font-size:12.5px}
.nf{border:2px solid var(--ink);padding:8px 10px;max-width:250px;background:var(--surface)}
.nf .nft{font:800 22px var(--f-body);display:block;border-bottom:1px solid var(--ink);padding-bottom:2px}
.nf .r{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0;font-size:13px}
.nf .r.thick{border-bottom:6px solid var(--ink);font-weight:600}
.nf .r.big{font:800 20px var(--f-body);border-bottom:3px solid var(--ink)}
.ibtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:3px 18px;font-size:12.5px}
.ans b{display:inline-block;min-width:62px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.link{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:4px}
.gate{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.err{color:var(--danger)}
@media (max-width:700px){
  .topbar{position:static;margin-bottom:8px}
  .status .clock{margin-left:0}
}

.nbhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.float{position:fixed;z-index:30;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.4);overflow:hidden;min-width:0}
.fbar{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.fbar:active{cursor:grabbing}
.fbar h2{font:600 18px var(--f-display);margin:0}
.fbar .grip{font-size:11.5px;color:var(--muted);margin-right:auto}
.fx{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:6px}
.fx:hover{color:var(--ink)}
.fx:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fbody{flex:1;min-height:0;overflow:auto;padding:10px 12px 18px;display:flex;flex-direction:column;gap:12px}
.fbody .fld{width:80px;padding:5px 6px}
.fbody thead th{white-space:normal;line-height:1.2;vertical-align:bottom;font-size:10.5px}
.fbody h3{font:600 15px var(--f-display);margin:0 0 2px}
.fbody th,.fbody td{padding:3px 4px}
.fresize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--muted) 50%,var(--muted) 58%,transparent 58%,transparent 70%,var(--muted) 70%,var(--muted) 78%,transparent 78%)}

</style>
</head>
<body>
<div id="root"></div>
